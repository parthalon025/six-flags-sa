# Self-hosting, whole thing:
#
#   docker compose up -d
#
# 3000 is the web app, 8787 is the party host (mailbox + REST + SSE). Point the
# app at the host with NEXT_PUBLIC_SYNC_URL when they are not on the same origin.
# Optional Postgres (E0) for profiles/contributions — no PostGIS.

services:
  party:
    build: .
    image: six-flags-sa:latest
    container_name: six-flags-sa
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
      - '${SYNC_PORT:-8787}:8787'
    environment:
      NODE_ENV: production
      # in-container ports; the mapping above is what changes on the host
      WEB_PORT: 3000
      PORT: 8787
      # persistence lives on the named volume, so a redeploy keeps live parties
      DATA_FILE: /data/parties.json
      # comma-separated allowlist, or * for anything
      ORIGIN: ${ORIGIN:-*}
      DATABASE_URL: ${DATABASE_URL:-postgres://parkbound:parkbound@db:5432/parkbound}
    volumes:
      - party-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8787/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:18-alpine
    container_name: parkbound-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: parkbound
      POSTGRES_PASSWORD: parkbound
      POSTGRES_DB: parkbound
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      # PG18+ stores data under /var/lib/postgresql/<major>/docker — mount the parent.
      - parkbound-db:/var/lib/postgresql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parkbound -d parkbound']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  party-data:
  parkbound-db:
