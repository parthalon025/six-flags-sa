<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#222}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
(async () => {
  const { model, kit, px, sheets, points } = await (await fetch('/model.json')).json();
  const { cols, rows, cells, trees, buildings, tracks, badges, terrains } = model;
  const c = document.getElementById('c');
  c.width = cols * px; c.height = rows * px;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;

  // Load the kit's referenced tile sheets (served from the asset ledger).
  const sheetImages = {};
  await Promise.all(Object.entries(sheets || {}).map(([id, s]) => new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => { sheetImages[id] = im; res(); };
    im.onerror = () => rej(new Error('sheet load failed: ' + id));
    im.src = s.url;
  })));

  // Compiled material albedos (sheets flagged `material`) → repeat patterns
  // on a fixed 4-cell tile: physical-ish grain scale, anchored at the canvas
  // origin — deterministic, no random offsets.
  const materialPatterns = {};
  for (const [sid, s] of Object.entries(sheets || {})) {
    if (!s.material) continue;
    const tile = document.createElement('canvas');
    tile.width = px * 4; tile.height = px * 4;
    tile.getContext('2d').drawImage(sheetImages[sid], 0, 0, tile.width, tile.height);
    materialPatterns[sid] = g.createPattern(tile, 'repeat');
  }

  // Dual-grid corner patterns: 16 mask variants cut from one seamless full
  // tile. Bits: NW=1, NE=2, SW=4, SE=8 — which quadrants hold the terrain.
  function buildPatterns(ref) {
    const sheet = sheets[ref.asset];
    const [tc, tr] = sheet.tiles[ref.tile];
    const T = sheet.tileSize;
    const sx = sheet.margin + tc * (T + sheet.spacing);
    const sy = sheet.margin + tr * (T + sheet.spacing);
    const h = T / 2;
    const QUADS = [[1, 0, 0], [2, h, 0], [4, 0, h], [8, h, h]]; // bit, qx, qy
    const patterns = [null];
    for (let mask = 1; mask <= 15; mask += 1) {
      const t = document.createElement('canvas');
      t.width = T; t.height = T;
      const tg = t.getContext('2d');
      // 1 — mask shape
      tg.fillStyle = '#fff';
      for (const [bit, qx, qy] of QUADS) {
        if (!(mask & bit)) continue;
        const horiz = bit === 1 || bit === 4 ? 2 : 1; // orthogonal neighbors
        const vert = bit === 1 || bit === 2 ? 4 : 8;
        const hOn = mask & (bit === 1 ? 2 : bit === 2 ? 1 : bit === 4 ? 8 : 4);
        const vOn = mask & (bit === 1 ? 4 : bit === 2 ? 8 : bit === 4 ? 1 : 2);
        if (!hOn && !vOn) {
          // isolated corner: rounded blob toward the outer corner
          tg.save(); tg.beginPath(); tg.rect(qx, qy, h, h); tg.clip();
          tg.beginPath(); tg.arc(h, h, h, 0, 7); tg.fill(); tg.restore();
        } else {
          tg.fillRect(qx, qy, h, h);
        }
      }
      // concave fillet where an absent quadrant meets two present arms
      for (const [bit, qx, qy] of QUADS) {
        if (mask & bit) continue;
        const hOn = mask & (bit === 1 ? 2 : bit === 2 ? 1 : bit === 4 ? 8 : 4);
        const vOn = mask & (bit === 1 ? 4 : bit === 2 ? 8 : bit === 4 ? 1 : 2);
        if (hOn && vOn) {
          tg.save(); tg.beginPath(); tg.rect(qx, qy, h, h); tg.clip();
          tg.fillRect(qx, qy, h, h);
          tg.globalCompositeOperation = 'destination-out';
          const ox = qx === 0 ? 0 : T; const oy = qy === 0 ? 0 : T;
          tg.beginPath(); tg.arc(ox, oy, h, 0, 7); tg.fill();
          tg.restore();
        }
      }
      // 2 — texture the shape from the sheet tile
      tg.globalCompositeOperation = 'source-in';
      tg.drawImage(sheetImages[ref.asset], sx, sy, T, T, 0, 0, T, T);
      if (ref.tint) {
        tg.globalCompositeOperation = 'source-atop';
        tg.fillStyle = ref.tint;
        tg.fillRect(0, 0, T, T);
      }
      tg.globalCompositeOperation = 'source-over';
      patterns[mask] = t;
    }
    return patterns;
  }

  const fullTile = (ref) => buildPatterns(ref)[15];

  // Keep in sync with lib/display-bake.mjs#cellHash — same jitter, one truth.
  const hash = (...nums) => {
    let h = 2166136261;
    for (const n of nums) { h ^= Math.trunc(n * 8191); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 10000) / 10000;
  };
  const T = {}; for (const [v, name] of Object.entries(terrains)) T[name] = Number(v);
  const NAME = terrains;
  const at = (x, y) => (x < 0 || y < 0 || x >= cols || y >= rows) ? T.outside : cells[y * cols + x];

  // 2D value noise over the hash lattice — the seeded "hand tremor" for
  // stroke displacement (research: multi-octave noise displacement).
  // Position-keyed, so closed rings stay closed and reruns stay identical.
  const vnoise = (x, y, salt) => {
    const x0 = Math.floor(x); const y0 = Math.floor(y);
    const fx = x - x0; const fy = y - y0;
    const sx = fx * fx * (3 - 2 * fx); const sy = fy * fy * (3 - 2 * fy);
    const a = hash(x0, y0, salt); const b = hash(x0 + 1, y0, salt);
    const cN = hash(x0, y0 + 1, salt); const d = hash(x0 + 1, y0 + 1, salt);
    const top = a + (b - a) * sx; const bot = cN + (d - cN) * sx;
    return top + (bot - top) * sy; // 0..1
  };

  // Bounded stroke displacement (kit.strokes.displacement): resample a
  // polyline/ring and push each point along its local normal by two-octave
  // value noise. |offset| never exceeds amplitude — the style_world_geo
  // budget certification holds the kit to.
  const disp = kit.strokes && kit.strokes.displacement || null;
  const dispWl = disp ? (disp.wavelength || 3) : 3;
  const dispAmpCells = disp ? disp.amplitude / px : 0;
  function displaced(pts, close, salt) {
    if (!disp || pts.length < 2) return pts;
    const src = close ? [...pts, pts[0]] : pts;
    const out = [];
    for (let i = 1; i < src.length; i += 1) {
      const [ax, ay] = src[i - 1];
      const [bx, by] = src[i];
      const len = Math.hypot(bx - ax, by - ay) || 1;
      const nx = -(by - ay) / len; const ny = (bx - ax) / len;
      const steps = Math.max(1, Math.round(len / 1.2));
      for (let s = (i === 1 ? 0 : 1); s <= steps; s += 1) {
        const x = ax + ((bx - ax) * s) / steps;
        const y = ay + ((by - ay) * s) / steps;
        const n = 0.65 * vnoise(x / dispWl, y / dispWl, salt)
          + 0.35 * vnoise((2 * x) / dispWl, (2 * y) / dispWl, salt + 13);
        const off = (n * 2 - 1) * dispAmpCells;
        out.push([x + nx * off, y + ny * off]);
      }
    }
    if (close) out.pop(); // tracePoly closes the ring itself
    return out;
  }

  // Texture primitives — one small painter per kind, params from the piece.
  const TEXTURES = {
    none() {},
    speckle(x, y, tx) {
      g.fillStyle = tx.color;
      g.fillRect(x * px + hash(x, y) * px, y * px + hash(x, y, 7) * px, 2, 2);
    },
    dot(x, y, tx) {
      g.fillStyle = tx.color;
      g.beginPath(); g.arc(x * px + hash(x, y) * px, y * px + hash(x, y, 9) * px, px / 6, 0, 7); g.fill();
    },
    tuft(x, y, tx) {
      g.strokeStyle = tx.color; g.lineWidth = 1;
      const ax = x * px + hash(x, y, 3) * px; const ay = y * px + hash(x, y, 4) * px;
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(ax - 2, ay - 3); g.moveTo(ax, ay); g.lineTo(ax + 2, ay - 3); g.stroke();
    },
    wave(x, y, tx) {
      g.strokeStyle = tx.color; g.lineWidth = 1.4;
      const wy = y * px + hash(x, y, 5) * px;
      g.beginPath(); g.moveTo(x * px + 2, wy); g.quadraticCurveTo(x * px + px / 2, wy - 3, x * px + px - 2, wy); g.stroke();
    },
    stripe(x, y, tx) {
      // density is the stripe cadence: 0.33 → every 3rd column.
      const period = Math.max(2, Math.round(1 / (tx.density ?? 0.33)));
      if (x % period !== 0) return;
      g.strokeStyle = tx.color; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x * px + 1, y * px); g.lineTo(x * px + 1, y * px + px); g.stroke();
    },
    hatch(x, y, tx) {
      g.strokeStyle = tx.color; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x * px, y * px + px); g.lineTo(x * px + px, y * px); g.stroke();
      // `lines` densifies the hatch: parallel diagonals in both half-cells
      // (atlas-plate water). Absent, the single diagonal above is unchanged.
      for (let i = 1; i < (tx.lines || 1); i += 1) {
        const o = (px / (tx.lines)) * i;
        g.beginPath(); g.moveTo(x * px + o, y * px + px); g.lineTo(x * px + px, y * px + o); g.stroke();
        g.beginPath(); g.moveTo(x * px, y * px + px - o); g.lineTo(x * px + px - o, y * px); g.stroke();
      }
    },
    grain(x, y, tx) {
      // Paper grain: two short hash-placed flecks at hash-picked alpha —
      // the tooth of cold-press paper under a wash, never a pattern tile.
      g.fillStyle = tx.color;
      for (let i = 0; i < 2; i += 1) {
        g.globalAlpha = 0.25 + 0.45 * hash(x, y, 45 + i);
        g.fillRect(x * px + hash(x, y, 21 + i) * px, y * px + hash(x, y, 33 + i) * px, 1.6, 1);
      }
      g.globalAlpha = 1;
    },
    dash(x, y, tx, t) {
      const hRun = at(x - 1, y) === t && at(x + 1, y) === t;
      const vRun = at(x, y - 1) === t && at(x, y + 1) === t;
      g.strokeStyle = tx.color; g.lineWidth = 1.4;
      const cx = x * px + px / 2; const cy = y * px + px / 2;
      if (hRun && !vRun) { g.beginPath(); g.moveTo(x * px + 3, cy); g.lineTo(x * px + px - 3, cy); g.stroke(); }
      else if (vRun && !hRun) { g.beginPath(); g.moveTo(cx, y * px + 3); g.lineTo(cx, y * px + px - 3); g.stroke(); }
    },
  };

  // Base squares under everything, then real tile art where the kit binds
  // it: full tiles on a terrain's own cells, dual-grid corner tiles on the
  // offset vertex grid so shores and tree lines curve with Kenney's own
  // rounding. Terrains without tile art keep the organic blob pass.
  // Terrain base. Where the venue has a DEM, a cell may take the kit's `steep`
  // variant instead of its base -- slope-aware material choice, so a bank reads
  // as bank and not as lawn painted at an angle.
  // A kit with a wash (watercolor) paints paper first and multiplies its
  // terrain fills over it -- pigment over paper, not opaque flats.
  const wash = kit.wash || null;
  if (wash) {
    g.fillStyle = wash.paper;
    g.fillRect(0, 0, c.width, c.height);
    g.globalCompositeOperation = 'multiply';
  }
  const steepCells = model.steep || null;
  for (let y = 0; y < rows; y += 1) {
    for (let x = 0; x < cols; x += 1) {
      const piece = kit.terrain[NAME[at(x, y)]];
      const isSteep = steepCells && steepCells[y * cols + x];
      g.fillStyle = (isSteep && piece.steep && piece.steep.base) || piece.base;
      g.fillRect(x * px, y * px, px, px);
    }
  }
  // Material underlay (ADR-0016 PBR pass): a piece bound to a compiled
  // albedo tiles it over its own cells at `mix` opacity -- the pattern
  // stands in for the ledger's avgColor in the mixHex(authored, avg, mix)
  // relation, so the texture reaches the paint without replacing the skin.
  for (const [name, piece] of Object.entries(kit.terrain)) {
    const pattern = materialPatterns[piece.material && piece.material.id];
    if (!pattern) continue;
    const t = T[name];
    g.fillStyle = pattern;
    g.globalAlpha = piece.material.mix != null ? piece.material.mix : 0.4;
    for (let y = 0; y < rows; y += 1) {
      for (let x = 0; x < cols; x += 1) {
        if (at(x, y) === t) g.fillRect(x * px, y * px, px, px);
      }
    }
    g.globalAlpha = 1;
  }
  if (wash) g.globalCompositeOperation = 'source-over';
  // Relief. Mirrors the mean-centred falloff in lib/terrain/hillshade.mjs
  // (shadeRgba); that one paints a PNG for MapLibre, this one paints the bake.
  // Change one, change the other.
  // Multiplying here -- over ground, under everything built on it --
  // is what makes a berm look like a berm on a map that has no third
  // dimension. Neutral is the field's own mean, so a flat park stays flat
  // rather than acquiring a gradient.
  if (model.shade) {
    const shade = model.shade;
    let mean = 0;
    for (const v of shade) mean += v;
    mean /= shade.length || 1;
    g.save();
    for (let y = 0; y < rows; y += 1) {
      for (let x = 0; x < cols; x += 1) {
        const d = (shade[y * cols + x] - mean) / 255;
        if (Math.abs(d) < 0.012) continue;
        g.fillStyle = d > 0 ? 'rgba(255,255,255,' + Math.min(0.5, d * 1.9) + ')'
                            : 'rgba(0,0,0,' + Math.min(0.5, -d * 1.9) + ')';
        g.fillRect(x * px, y * px, px, px);
      }
    }
    g.restore();
  }

  // Parking aisles: short dashes along each lot's own long axis, so a lot
  // reads as a lot. Spacing comes from real aisle geometry in display-bake.mjs,
  // not from what looked right at one zoom.
  if (model.lotRows && model.lotRows.length) {
    const lotPiece = kit.terrain.lot || {};
    g.save();
    g.strokeStyle = (lotPiece.texture && lotPiece.texture.color) || 'rgba(255,255,255,0.7)';
    g.lineWidth = Math.max(1, px * 0.09);
    g.lineCap = 'round';
    const half = px * 0.42;
    for (const r of model.lotRows) {
      const cx = r.x * px;
      const cy = r.y * px;
      g.beginPath();
      g.moveTo(cx - r.dx * half, cy - r.dy * half);
      g.lineTo(cx + r.dx * half, cy + r.dy * half);
      g.stroke();
    }
    g.restore();
  }

  const tiledPatterns = {};
  for (const [name, piece] of Object.entries(kit.terrain)) {
    if (piece.tiles && model.autotile?.[name]) tiledPatterns[name] = buildPatterns(piece.tiles);
  }
  if (kit.terrain.ground.tiles) {
    const full = fullTile(kit.terrain.ground.tiles);
    for (let y = 0; y < rows; y += 1) {
      for (let x = 0; x < cols; x += 1) {
        if (at(x, y) === T.ground) g.drawImage(full, x * px, y * px, px, px);
      }
    }
  }
  if (wash) g.globalCompositeOperation = 'multiply'; // edge blobs are pigment too
  for (const name of ['grass', 'wood', 'water']) {
    const t = T[name];
    if (tiledPatterns[name]) {
      const masks = model.autotile[name];
      const patterns = tiledPatterns[name];
      for (let vy = 0; vy <= rows; vy += 1) {
        for (let vx = 0; vx <= cols; vx += 1) {
          const mask = masks[vy * (cols + 1) + vx];
          if (mask) g.drawImage(patterns[mask], (vx - 0.5) * px, (vy - 0.5) * px, px, px);
        }
      }
      continue;
    }
    g.fillStyle = kit.terrain[name].base;
    for (let y = 0; y < rows; y += 1) {
      for (let x = 0; x < cols; x += 1) {
        if (at(x, y) !== t) continue;
        const edge = at(x - 1, y) !== t || at(x + 1, y) !== t || at(x, y - 1) !== t || at(x, y + 1) !== t;
        if (!edge) continue;
        const r = px * (0.62 + 0.16 * hash(x, y, 11));
        g.beginPath();
        g.arc(x * px + px / 2, y * px + px / 2, r, 0, 7);
        g.fill();
      }
    }
  }
  if (wash) g.globalCompositeOperation = 'source-over';
  // Pigment-pooling rim: where a piece declares one, its cells darken near
  // their own boundary with alpha falling off along the lib-computed
  // distance field (model.rim) — the drying edge of a watercolor wash.
  if (model.rim) {
    for (const [name, piece] of Object.entries(kit.terrain)) {
      const field = model.rim[name];
      if (!field || !piece.rim) continue;
      g.fillStyle = piece.rim.color;
      for (let y = 0; y < rows; y += 1) {
        for (let x = 0; x < cols; x += 1) {
          const d = field[y * cols + x];
          if (d < 1 || d > piece.rim.reach) continue;
          g.globalAlpha = piece.rim.alpha * (1 - (d - 1) / piece.rim.reach);
          g.fillRect(x * px, y * px, px, px);
        }
      }
    }
    g.globalAlpha = 1;
  }
  for (let y = 0; y < rows; y += 1) {
    for (let x = 0; x < cols; x += 1) {
      const t = at(x, y);
      if (t === T.road || t === T.service) continue; // roads draw as polylines
      if (tiledPatterns[NAME[t]] || (t === T.ground && kit.terrain.ground.tiles)) continue;
      const tx = kit.terrain[NAME[t]].texture || { kind: 'none' };
      const gated = tx.kind === 'stripe' || hash(x, y) < (tx.density ?? 0.3);
      if (gated) TEXTURES[tx.kind](x, y, tx, t);
    }
  }

  const toPx = ([x, y]) => [x * px, y * px];
  const tracePoly = (ring, dx = 0, dy = 0) => {
    g.beginPath();
    ring.forEach((pt, i) => {
      const [x, y] = toPx(pt);
      if (i === 0) g.moveTo(x + dx, y + dy); else g.lineTo(x + dx, y + dy);
    });
    g.closePath();
  };
  const traceLine = (pts) => {
    g.beginPath();
    pts.forEach((pt, i) => {
      const [x, y] = toPx(pt);
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    });
  };

  // Roads as smooth polylines: service lanes quiet, walkways cased with a
  // dashed centerline — crisp diagonals the cell grid cannot give.
  // Displaced geometry is computed once per road so every pass (casing,
  // fill, centerline) wobbles identically.
  g.lineJoin = 'round'; g.lineCap = 'round';
  const roadPiece = kit.terrain.road; const servicePiece = kit.terrain.service;
  const roadPts = model.roads.map((r) => displaced(r.pts, false, 101));
  const eachRoad = (kind, fn) => model.roads.forEach((r, i) => { if (r.kind === kind) fn(roadPts[i]); });
  eachRoad('service', (pts) => {
    if (servicePiece.style === 'dashed') g.setLineDash([px * 0.5, px * 0.42]);
    traceLine(pts); g.strokeStyle = servicePiece.base; g.lineWidth = px * 0.4; g.stroke();
    g.setLineDash([]);
  });
  if (roadPiece.style === 'double') {
    // Hairline double-stroke walkways: ink casing with the paper base
    // reopened inside leaves two crisp parallel hairlines. No centerline.
    eachRoad('path', (pts) => { traceLine(pts); g.strokeStyle = roadPiece.texture.color; g.lineWidth = px * 0.5; g.stroke(); });
    eachRoad('path', (pts) => { traceLine(pts); g.strokeStyle = roadPiece.base; g.lineWidth = px * 0.36; g.stroke(); });
  } else {
    eachRoad('path', (pts) => { traceLine(pts); g.strokeStyle = roadPiece.texture.color; g.lineWidth = px * 0.95; g.stroke(); });
    eachRoad('path', (pts) => { traceLine(pts); g.strokeStyle = roadPiece.base; g.lineWidth = px * 0.72; g.stroke(); });
    g.setLineDash([px * 0.55, px * 0.75]);
    eachRoad('path', (pts) => { traceLine(pts); g.strokeStyle = roadPiece.texture.color; g.lineWidth = Math.max(1.2, px * 0.08); g.stroke(); });
    g.setLineDash([]);
  }

  const B = kit.sprites.building;
  const buildingPattern = materialPatterns[B.material && B.material.id] || null;
  g.lineJoin = 'round';
  for (const b of buildings) {
    const ring = displaced(b.ring, true, 202);
    if (B.style === 'outline') {
      tracePoly(ring); g.strokeStyle = B.edge; g.lineWidth = 2; g.stroke();
      continue;
    }
    if (B.style === 'plan') {
      // Plan-view silhouette: flat fill, hairline edge, and corner ticks —
      // the drafting-table read, not a fake extrusion.
      tracePoly(ring);
      g.fillStyle = B.roofs[b.roof % B.roofs.length]; g.fill();
      if (buildingPattern) {
        g.fillStyle = buildingPattern;
        g.globalAlpha = B.material.mix != null ? B.material.mix : 0.4;
        g.fill();
        g.globalAlpha = 1;
      }
      g.strokeStyle = B.edge; g.lineWidth = 1.1; g.stroke();
      g.lineWidth = 1;
      const tick = px * 0.24;
      for (let vi = 0; vi < ring.length; vi += 1) {
        const [vx, vy] = ring[vi];
        for (const [nx2, ny2] of [ring[(vi + ring.length - 1) % ring.length], ring[(vi + 1) % ring.length]]) {
          const len = Math.hypot(vx - nx2, vy - ny2) || 1;
          g.beginPath();
          g.moveTo(vx * px, vy * px);
          g.lineTo(vx * px + ((vx - nx2) / len) * tick, vy * px + ((vy - ny2) / len) * tick);
          g.stroke();
        }
      }
      continue;
    }
    if (B.style !== 'flat') {
      g.fillStyle = B.wall; tracePoly(ring, 0, px * B.drop); g.fill();
    }
    g.fillStyle = B.roofs[b.roof % B.roofs.length]; tracePoly(ring); g.fill();
    if (buildingPattern) {
      g.fillStyle = buildingPattern;
      g.globalAlpha = B.material.mix != null ? B.material.mix : 0.4;
      g.fill();
      g.globalAlpha = 1;
      tracePoly(ring);
    }
    g.strokeStyle = B.edge; g.lineWidth = 1.6; g.stroke();
  }

  const CO = kit.sprites.coaster;
  const SL = kit.sprites.slide;
  g.lineCap = 'round';
  const trackPts = tracks.map((tr) => displaced(tr.pts, false, 303));
  // Schematic tracks: perpendicular tick marks along the run — the atlas
  // plate's ride notation. Deterministic: ticks pace the arc length.
  const drawTicks = (pts, color, half) => {
    g.strokeStyle = color; g.lineWidth = 1;
    let carry = 0;
    for (let i = 1; i < pts.length; i += 1) {
      const [ax, ay] = pts[i - 1]; const [bx, by] = pts[i];
      const len = Math.hypot(bx - ax, by - ay);
      if (!len) continue;
      const nx = -(by - ay) / len; const ny = (bx - ax) / len;
      let s = carry;
      while (s <= len) {
        const x = (ax + ((bx - ax) * s) / len) * px;
        const y = (ay + ((by - ay) * s) / len) * px;
        g.beginPath(); g.moveTo(x - nx * half, y - ny * half); g.lineTo(x + nx * half, y + ny * half); g.stroke();
        s += 0.6;
      }
      carry = s - len;
    }
  };
  tracks.forEach((tr, i) => {
    if ((tr.kind === 'coaster' ? CO : SL).style !== 'tube') return; // flat styles cast no shadow
    traceLine(trackPts[i]); g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = px * 0.62; g.stroke();
  });
  tracks.forEach((tr, i) => {
    if (tr.kind !== 'coaster') return;
    const pts = trackPts[i];
    if (CO.style === 'mono') {
      traceLine(pts); g.strokeStyle = CO.rail; g.lineWidth = Math.max(1.4, px * 0.12); g.stroke();
      return;
    }
    if (CO.style === 'schematic') {
      traceLine(pts); g.strokeStyle = CO.rail; g.lineWidth = Math.max(1.2, px * 0.1); g.stroke();
      drawTicks(pts, CO.rail, px * 0.17);
      return;
    }
    traceLine(pts); g.strokeStyle = CO.rail; g.lineWidth = px * 0.42; g.stroke();
    g.setLineDash([2.5, px * 0.4]); traceLine(pts); g.strokeStyle = CO.tie; g.lineWidth = px * 0.2; g.stroke();
    g.setLineDash([]);
  });
  tracks.forEach((tr, i) => {
    if (tr.kind !== 'slide') return;
    const pts = trackPts[i];
    const color = SL.colors[tr.idx % SL.colors.length];
    if (SL.style === 'mono') {
      traceLine(pts); g.strokeStyle = color; g.lineWidth = Math.max(1.4, px * 0.14); g.stroke();
      return;
    }
    if (SL.style === 'schematic') {
      traceLine(pts); g.strokeStyle = color; g.lineWidth = Math.max(1.2, px * 0.1); g.stroke();
      drawTicks(pts, color, px * 0.17);
      return;
    }
    traceLine(pts); g.strokeStyle = SL.casing; g.lineWidth = px * 0.56 * SL.width; g.stroke();
    traceLine(pts); g.strokeStyle = color; g.lineWidth = px * 0.36 * SL.width; g.stroke();
  });

  const TR = kit.sprites.tree;
  const treeImg = TR.sprite ? sheetImages[TR.sprite.asset] : null;
  if (TR.style !== 'none') {
    for (const t of trees) {
      const x = t.x * px; const y = t.y * px;
      const r = (t.big ? 0.44 : 0.3) * px * TR.scale;
      if (treeImg) {
        // Custom sprite asset, anchored at its base on the truth-derived spot.
        const w = r * 3.2;
        g.drawImage(treeImg, x - w / 2, y - w * 0.94, w, w);
        continue;
      }
      if (TR.style === 'dot') {
        g.fillStyle = TR.canopy; g.beginPath(); g.arc(x, y, r * 0.6, 0, 7); g.fill();
        continue;
      }
      g.fillStyle = TR.shadow; g.beginPath(); g.ellipse(x + r / 4, y + r / 3, r, r * 0.6, 0, 0, 7); g.fill();
      g.fillStyle = TR.canopy; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
      g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = 1; g.stroke();
      g.fillStyle = TR.highlight; g.beginPath(); g.arc(x - r / 3, y - r / 3, r / 2.4, 0, 7); g.fill();
    }
  }

  const BD = kit.sprites.badge;
  for (const b of badges) {
    // Pinned marker: the tail's tip sits on the exact truth coordinate.
    const x = b.x * px; const y = b.y * px;
    const r = px * 0.42;
    const cy = y - r * 1.5;
    const color = BD[b.kind] || '#666';
    g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(x, y + 1.5, r * 0.5, r * 0.24, 0, 0, 7); g.fill();
    g.fillStyle = color;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - r * 0.42, cy + r * 0.7); g.lineTo(x + r * 0.42, cy + r * 0.7); g.closePath(); g.fill();
    g.fillStyle = color;
    g.beginPath(); g.arc(x, cy, r, 0, 7); g.fill();
    g.strokeStyle = '#FFFFFF'; g.lineWidth = 1.5; g.stroke();
    // Glyph from the icon ledger (white-on-transparent), and nothing else.
    // ADR-0021 clause 1 bakes no legible text into any band, so a kind whose
    // icon does not resolve paints a bare disc rather than a letter — an
    // unresolvable badge is a missing asset, not a glyph. What makes that
    // loud is the style contract's `style_no_baked_text` row, which reads
    // this same icon ledger and fails naming the kind.
    const icon = sheetImages[BD.icons?.[b.kind]?.asset];
    if (icon) {
      // 1.1r leaves a clear disc-ink moat between glyph edge and ring —
      // the style contract samples that moat (display-style-contract.mjs).
      const s = r * 1.1;
      g.drawImage(icon, x - s / 2, cy - s / 2, s, s);
    }
  }

  // Style-contract sampling: the certifier's points (cell coords) read
  // back the painted canvas — the pixels the phone would actually show.
  const pts = points || [];
  window.__samples = pts.map((p) => {
    const d = g.getImageData(
      Math.max(0, Math.min(c.width - 1, Math.round(p.x * px))),
      Math.max(0, Math.min(c.height - 1, Math.round(p.y * px))),
      1, 1,
    ).data;
    return [d[0], d[1], d[2], d[3]];
  });

  window.__done = true;
})().catch((err) => { console.error(err); window.__done = true; window.__error = String(err); });
</script>
