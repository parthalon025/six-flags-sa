# Always-watching triage for the agent-handoff queue. Runs Claude Code
# against a single newly-filed (or newly-labeled) agent-handoff issue,
# following the global `triage` skill's state machine (docs/agents/policies/
# agent-handoff.md, docs/agents/policies/github-issue-tracker.md). It moves
# the issue to ready-for-agent (with a posted Agent Brief) or ready-for-human
# — it never pushes code itself.
#
# Requires the ANTHROPIC_API_KEY repository secret (Settings > Secrets and
# variables > Actions). Without it this workflow fails closed and the queue
# falls back to human triage via /triage.

name: Agent handoff watch

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    if: >-
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'agent-handoff')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'agent-handoff')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install global triage skill
        run: node scripts/install-global-skills.mjs --agent claude-code

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            Issue #${{ github.event.issue.number }} was just filed or labeled
            `agent-handoff`. Read docs/agents/policies/agent-handoff.md and
            docs/agents/policies/github-issue-tracker.md for this repo's
            conventions, then call the Skill tool with "triage" and follow it
            to triage this one issue: gather context, verify the claim,
            recommend a category and state, and apply the outcome
            (`ready-for-agent` with a posted Agent Brief, or `ready-for-human`
            with a note on why it can't be delegated).

            Every comment you post must start with:
            > *This was generated by AI during triage.*

            Only touch issue #${{ github.event.issue.number }} — do not
            triage, label, or comment on any other issue or PR in this run.
          claude_args: |
            --allowedTools "Bash(gh:*),Bash(git log:*),Bash(git grep:*),Grep,Glob,Read"
