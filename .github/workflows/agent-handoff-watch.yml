# Always-watching triage for the agent-handoff queue. Runs Claude Code
# against a single newly-filed (or newly-labeled) agent-handoff issue,
# following the global `triage` skill's state machine (docs/agents/policies/
# agent-handoff.md, docs/agents/policies/github-issue-tracker.md). It moves
# the issue to ready-for-agent (with a posted Agent Brief) or ready-for-human
# — it never pushes code itself.
#
# The trigger decision and the gh-command scoping both live in
# scripts/lib/agent-handoff-watch.mjs (tested in
# test/scripts/agent-handoff-watch.test.mjs) rather than in this YAML —
# Claude is only ever allowed to call `gh` through the scoped CLI, which
# refuses any comment/label/edit naming a different issue than the one that
# triggered this run.
#
# Requires the ANTHROPIC_API_KEY repository secret (Settings > Secrets and
# variables > Actions). Without it this workflow fails closed and the queue
# falls back to human triage via /triage.

name: Agent handoff watch

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check trigger
        id: check
        run: node scripts/ci/agent-handoff-watch.mjs check-trigger

      - name: Install global triage skill
        if: steps.check.outputs.should_triage == 'true'
        run: node scripts/install-global-skills.mjs --agent claude-code

      - uses: anthropics/claude-code-action@v1
        if: steps.check.outputs.should_triage == 'true'
        env:
          HANDOFF_ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            Issue #${{ github.event.issue.number }} was just filed or labeled
            `agent-handoff`. Read docs/agents/policies/agent-handoff.md and
            docs/agents/policies/github-issue-tracker.md for this repo's
            conventions, then call the Skill tool with "triage" and follow it
            to triage this one issue: gather context, verify the claim,
            recommend a category and state, and apply the outcome
            (`ready-for-agent` with a posted Agent Brief, or `ready-for-human`
            with a note on why it can't be delegated).

            Every comment you post must start with:
            > *This was generated by AI during triage.*

            Do not call `gh` directly. Use
            `node scripts/ci/agent-handoff-watch.mjs gh -- <gh args>` for
            every GitHub read or write instead (e.g. `... gh -- issue view
            ${{ github.event.issue.number }} --comments`) — it only allows
            reads, comments, and label edits on issue
            #${{ github.event.issue.number }}, plus the read-only
            `issue list` / `search issues` the triage skill's duplicate check
            needs.
          claude_args: |
            --allowedTools "Bash(node scripts/ci/agent-handoff-watch.mjs gh:*),Grep,Glob,Read"
