# Weekly refresh of committed official-site caches (JS-rendered park listings).
# Without a schedule they only update when someone runs
# `npm run venues:research -- <id> --fetch --browser` by hand (#410).

name: Sync official site research

on:
  schedule:
    - cron: '0 9 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-official-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Fetch official site listings
        id: research
        run: |
          set +e
          npm run venues:research -- --all --fetch --browser --json > research-report.json
          research_exit=$?
          cat research-report.json
          echo "research_exit=$research_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize research results
        id: summary
        run: |
          set -euo pipefail
          node scripts/official-research-summary.mjs research-report.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Warn when research CLI exited non-zero
        if: steps.research.outputs.research_exit != '0'
        run: echo "::warning::venues:research exited non-zero but partial results were summarized."

      - name: Open a draft pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/official-research-pr.mjs
