# Weekly refresh of committed external research caches (ParksAPI, Queue-Times,
# Wikidata, etc.). Without a schedule they only update when someone runs
# `npm run venues:sync-sources -- --fetch` by hand (#405).

name: Sync external sources

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-external-sources
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Sync external source caches
        id: sync
        env:
          ACCESSIBILITY_CLOUD_TOKEN: ${{ secrets.ACCESSIBILITY_CLOUD_TOKEN }}
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          GUEST_TRACES_TOKEN: ${{ secrets.GUEST_TRACES_TOKEN }}
          GUEST_TRACES_API: ${{ secrets.GUEST_TRACES_API }}
        run: |
          set +e
          npm run venues:sync-sources -- --all --fetch --json > sync-report.json
          sync_exit=$?
          cat sync-report.json
          echo "sync_exit=$sync_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize sync results
        id: summary
        run: |
          set -euo pipefail
          node scripts/sync-sources-summary.mjs sync-report.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Warn when sync CLI exited non-zero
        if: steps.sync.outputs.sync_exit != '0'
        run: echo "::warning::venues:sync-sources exited non-zero but partial results were summarized."

      - name: Open a draft pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="sync/external-sources-${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add 'data/venues/*-cache.json'
          if git diff --cached --quiet; then
            echo "::notice::No external cache changes — fleet caches are current."
            exit 0
          fi
          title="Sync external source caches"
          git commit -m "$title" \
                     -m "Generated by Sync external sources workflow, run ${GITHUB_RUN_ID}."
          git push -u origin "$branch"
          {
            echo "Refreshed by [Sync external sources](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            cat sync-summary.md
          } > pr-body.md
          gh pr create --draft --base main --head "$branch" \
            --title "$title" \
            --body-file pr-body.md
