# After a merge to main, bump app semver from Conventional Commits when the
# merge touched the app. Skips its own bump commits so it does not loop.
# GitNexus is session-local (`.gitnexus/` is gitignored) and is not committed.

name: Post-merge main

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bump-version-main
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.event.head_commit.author.name != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version to') &&
      !startsWith(github.event.head_commit.message, 'chore: refresh gitnexus index')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Skip GitNexus-only commits
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gitnexus-ci.mjs

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '24'

      - name: Git identity
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve release note from the merge
        if: steps.gate.outputs.run == 'true'
        id: note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MSG="${{ github.event.head_commit.message }}"
          NOTE=$(printf '%s' "$MSG" | head -1)
          if [[ "$NOTE" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
            PR="${BASH_REMATCH[1]}"
            TITLE=$(gh pr view "$PR" --json title -q .title 2>/dev/null || true)
            if [ -n "$TITLE" ]; then NOTE="$TITLE"; fi
          fi
          {
            echo 'note<<EOF'
            printf '%s' "$NOTE"
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Bump version
        if: steps.gate.outputs.run == 'true'
        id: bump
        run: node scripts/bump-version.mjs "${{ steps.note.outputs.note }}"

      - name: Commit version bump
        if: steps.gate.outputs.run == 'true' && steps.bump.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          node scripts/ci/stage-version-stamps.mjs
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          git commit -m "chore: bump version to $VERSION"

      - name: Version matrix
        if: steps.gate.outputs.run == 'true'
        env:
          BUMP_FROM: ${{ steps.bump.outputs.bump_from }}
          BUMP_TO: ${{ steps.bump.outputs.bump_to }}
          BUMP_SKIPPED: ${{ steps.bump.outputs.skipped }}
          MERGE_MESSAGE: ${{ github.event.head_commit.message }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APP_STORE_CONNECT_API_KEY:-}" ]; then
            mkdir -p secrets
            echo "$APP_STORE_CONNECT_API_KEY" | base64 -d > secrets/AuthKey.p8
            export APP_STORE_CONNECT_API_KEY_PATH=./secrets/AuthKey.p8
          fi
          node scripts/deploy-version-report.mjs --markdown

      - name: Comment version matrix on merged PR
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_FROM: ${{ steps.bump.outputs.bump_from }}
          BUMP_TO: ${{ steps.bump.outputs.bump_to }}
          BUMP_SKIPPED: ${{ steps.bump.outputs.skipped }}
          MERGE_MESSAGE: ${{ github.event.head_commit.message }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: |
          set -euo pipefail
          MSG="${MERGE_MESSAGE}"
          if [[ "$MSG" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
            PR="${BASH_REMATCH[1]}"
            if [ -n "${APP_STORE_CONNECT_API_KEY:-}" ]; then
              mkdir -p secrets
              echo "$APP_STORE_CONNECT_API_KEY" | base64 -d > secrets/AuthKey.p8
              export APP_STORE_CONNECT_API_KEY_PATH=./secrets/AuthKey.p8
            fi
            BODY=$(node scripts/deploy-version-report.mjs --markdown)
            gh pr comment "$PR" --body "$BODY"
          fi

      - name: Push
        if: steps.gate.outputs.run == 'true' && steps.bump.outputs.skipped != 'true'
        run: git push
