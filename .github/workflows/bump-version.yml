# After a merge to main, bump app semver from Conventional Commits when the
# merge touched the app. Skips its own bump commits so it does not loop.
# GitNexus is session-local (`.gitnexus/` is gitignored) and is not committed.

name: Post-merge main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      wait_for_production:
        description: Poll Vercel production until semver matches repo
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-version-main
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit.author.name != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version to') &&
      !startsWith(github.event.head_commit.message, 'chore: refresh gitnexus index'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run: ${{ steps.gate.outputs.run }}
      bump_from: ${{ steps.bump.outputs.bump_from }}
      bump_to: ${{ steps.bump.outputs.bump_to }}
      skipped: ${{ steps.bump.outputs.skipped }}
      merge_pr: ${{ steps.merge.outputs.pr }}
      merge_message: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Skip GitNexus-only commits
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/gitnexus-ci.mjs
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '24'

      - name: Git identity
        if: steps.gate.outputs.run == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve merge PR
        if: steps.gate.outputs.run == 'true'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR=""
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            MSG="${{ github.event.head_commit.message }}"
            if [[ "$MSG" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
              PR="${BASH_REMATCH[1]}"
            elif [ -n "${{ github.sha }}" ]; then
              PR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number' 2>/dev/null || true)
            fi
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Resolve release note from the merge
        if: steps.gate.outputs.run == 'true' && github.event_name != 'workflow_dispatch'
        id: note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MSG="${{ github.event.head_commit.message }}"
          NOTE=$(printf '%s' "$MSG" | head -1)
          if [[ "$MSG" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
            PR="${BASH_REMATCH[1]}"
            TITLE=$(gh pr view "$PR" --json title -q .title 2>/dev/null || true)
            if [ -n "$TITLE" ]; then NOTE="$TITLE"; fi
          fi
          {
            echo 'note<<EOF'
            printf '%s' "$NOTE"
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Bump version
        if: steps.gate.outputs.run == 'true'
        id: bump
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(node -p "require('./apps/party-tracker/package.json').version")
            {
              echo "skipped=true"
              echo "bump_from=$VERSION"
              echo "bump_to=$VERSION"
            } >> "$GITHUB_OUTPUT"
          else
            node scripts/bump-version.mjs "${{ steps.note.outputs.note }}"
          fi

      - name: Commit version bump
        if: steps.gate.outputs.run == 'true' && steps.bump.outputs.skipped != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          node scripts/ci/stage-version-stamps.mjs
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          git commit -m "chore: bump version to $VERSION"

      - name: Push
        if: steps.gate.outputs.run == 'true' && steps.bump.outputs.skipped != 'true' && github.event_name != 'workflow_dispatch'
        run: git push

  version-matrix:
    needs: bump
    if: needs.bump.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync main after bump push
        run: git pull origin main

      - name: Version matrix (post-deploy)
        env:
          BUMP_FROM: ${{ needs.bump.outputs.bump_from }}
          BUMP_TO: ${{ needs.bump.outputs.bump_to }}
          BUMP_SKIPPED: ${{ needs.bump.outputs.skipped }}
          MERGE_MESSAGE: ${{ needs.bump.outputs.merge_message }}
          MERGE_PR: ${{ needs.bump.outputs.merge_pr }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
          WAIT_FOR_PRODUCTION: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_for_production || needs.bump.outputs.skipped != 'true' }}
        run: |
          set -euo pipefail
          ARGS=(--markdown)
          if [ "${WAIT_FOR_PRODUCTION}" = "true" ]; then
            ARGS+=(--wait)
          fi
          if [ "${BUMP_SKIPPED}" = "true" ]; then
            ARGS+=(--skipped)
          fi
          if [ -n "${MERGE_PR}" ]; then
            ARGS+=(--comment --pr "$MERGE_PR")
          fi
          node scripts/deploy-version-report.mjs "${ARGS[@]}"
