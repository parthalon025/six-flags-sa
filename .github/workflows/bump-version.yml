# After a merge to main, bump app semver from Conventional Commits when the
# merge touched the app. Skips its own bump commits so it does not loop.
# GitNexus is session-local (`.gitnexus/` is gitignored) and is not committed.

name: Post-merge main

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bump-version-main
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.event.head_commit.author.name != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version to') &&
      !startsWith(github.event.head_commit.message, 'chore: refresh gitnexus index')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Skip GitNexus-only commits
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gitnexus-ci.mjs

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '24'

      - name: Git identity
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve release note from the merge
        if: steps.gate.outputs.run == 'true'
        id: note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MSG="${{ github.event.head_commit.message }}"
          NOTE=$(printf '%s' "$MSG" | head -1)
          if [[ "$NOTE" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
            PR="${BASH_REMATCH[1]}"
            TITLE=$(gh pr view "$PR" --json title -q .title 2>/dev/null || true)
            if [ -n "$TITLE" ]; then NOTE="$TITLE"; fi
          fi
          {
            echo 'note<<EOF'
            printf '%s' "$NOTE"
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Bump version
        if: steps.gate.outputs.run == 'true'
        id: bump
        run: node scripts/bump-version.mjs "${{ steps.note.outputs.note }}"

      - name: Commit version bump
        if: steps.gate.outputs.run == 'true' && steps.bump.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          git add \
            package.json \
            package-lock.json \
            README.md \
            apps/party-tracker/package.json \
            packages/shared/package.json \
            packages/venue-builder/package.json \
            apps/party-tracker/public/app-version.json \
            apps/party-tracker/public/sw.js \
            apps/party-tracker/data/release-notes.json
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          git commit -m "chore: bump version to $VERSION"

      - name: Push
        if: steps.gate.outputs.run == 'true' && steps.bump.outputs.skipped != 'true'
        run: git push
