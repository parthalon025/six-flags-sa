# Weekly drift watch — does OpenStreetMap still match what we shipped, and
# does a fresh bake still match the style certification we shipped with it?

name: Drift watch

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Fleet drift check
        id: drift
        run: |
          set +e
          npm run venues:drift-watch -- --json --revoke > drift-report.json
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          cat drift-report.json
          if git diff --quiet -- packages/venue-builder/data/venues/*/certification.json; then
            echo "revoke_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "revoke_changed=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Open PR for drift revocations
        if: steps.drift.outputs.exit != '0' && steps.drift.outputs.revoke_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="drift-revoke/$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add packages/venue-builder/data/venues/*/certification.json
          git commit -m "chore(builder): revoke certification for OSM drift (#400)

          Weekly drift watch found venues that would change on rebuild.
          Stamp certification.json as revoked until rebuilt and re-certified."
          git push -u origin "$branch"
          {
            echo "## Summary"
            echo
            echo "Weekly drift watch detected venues whose shipped bundles no longer match a rebuild dry-run."
            echo "This PR stamps their \`certification.json\` as **revoked** until a human rebuilds and re-runs \`venues:certify\`."
            echo
            echo "Closes #400 (revocation path)."
            echo
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > pr-body.md
          gh pr create --base main --head "$branch" \
            --title "chore(builder): revoke certification for OSM drift (#400)" \
            --body-file pr-body.md

      - name: Check for existing drift issue
        id: existing
        if: steps.drift.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "Venue drift detected"' \
            --json number --jq '.[0].number // empty')
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Comment on existing drift issue
        if: steps.drift.outputs.exit != '0' && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "${{ steps.existing.outputs.number }}" \
            --body "Drift still detected as of $(date -u +%Y-%m-%dT%H:%M:%SZ) — see this run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Open handoff issue on drift
        if: steps.drift.outputs.exit != '0' && steps.existing.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Venue drift detected — OSM no longer matches shipped bundles" \
            --label agent-handoff \
            --label needs-triage \
            --body "$(cat <<'EOF'
          ## What failed
          Weekly drift watch found venues that would change on rebuild.

          ## Where
          Workflow: `.github/workflows/drift-watch.yml`
          Report: see workflow artifacts / `npm run venues:drift-watch -- --json`

          ## Reproduction
          ```bash
          npm run venues:drift-watch
          ```

          ## Impact
          Non-blocking for app runtime; drifted parks should lose certification until re-certified.

          ## Suggested fix
          Rebuild affected venues, re-run `venues:certify`, open PRs for human review.
          EOF
          )"

  # A committed `bakes.<kit>.signature` row (data/venues/*/display/
  # display-certification.json, folded in by display-pack.mjs from a local
  # or build-venue.yml bake) is only checked at bake time — nothing else in
  # CI re-verifies it, so a later change to a kit, a reference profile, or
  # the compositor can leave it claiming a pass that's no longer true (#509).
  # Same shape as the `drift` job above, aimed at the bake tier instead: a
  # weekly re-bake compares fresh signatures against what shipped.
  bake-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Same Chromium install `build-venue.yml` already pays for to bake —
      # reused here rather than inventing a second rendering path.
      - run: npx playwright install chromium --with-deps

      - name: Bake certification drift check
        id: drift
        run: |
          set +e
          npm run venues:bake-drift-watch -- --json > bake-drift-report.json
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          cat bake-drift-report.json
          exit 0

      - name: Check for existing bake drift issue
        id: existing
        if: steps.drift.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "Bake certification drift detected"' \
            --json number --jq '.[0].number // empty')
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Comment on existing bake drift issue
        if: steps.drift.outputs.exit != '0' && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "${{ steps.existing.outputs.number }}" \
            --body "Bake drift still detected as of $(date -u +%Y-%m-%dT%H:%M:%SZ) — see this run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Open handoff issue on bake drift
        if: steps.drift.outputs.exit != '0' && steps.existing.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Bake certification drift detected — a fresh bake no longer matches what shipped" \
            --label agent-handoff \
            --label needs-triage \
            --body "$(cat <<'EOF'
          ## What failed
          Weekly bake drift watch re-baked every venue's committed kits and found a
          signature that no longer matches its `display-certification.json` row.

          ## Where
          Workflow: `.github/workflows/drift-watch.yml` (`bake-drift` job)
          Report: see workflow artifacts / `npm run venues:bake-drift-watch -- --json`

          ## Reproduction
          ```bash
          npm run venues:bake-drift-watch
          ```

          ## Impact
          Non-blocking for app runtime; the affected venue/kit's `bake_certs` row is no
          longer trustworthy and should not be relied on until re-certified.

          ## Suggested fix
          Re-bake the affected venue(s) (`venues:bake`), re-run `venues:display --bake`,
          open a PR with the refreshed certification for human review.
          EOF
          )"
