# Add a park to the app without a laptop.
#
# Everything a venue is made of comes out of scripts/build-venue.mjs: two JSON
# files, a manifest row and a regenerated index. Running that needs node, a
# checkout and a few minutes of talking to OpenStreetMap — which is exactly the
# kind of errand a runner should do. Fill the form in, and the job opens a pull
# request with the built park in it for someone to look at before it ships.
#
# Actions → Build a venue → Run workflow.

name: Build a venue

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Build a venue already here again, exactly as it was built before, from its recipe. A venue id, or "all". Wins over everything below — use it after a tag rule changes.'
        required: false
        type: string
      place:
        description: 'Place to resolve, e.g. "Cedar Point, Sandusky, Ohio". Be specific — plain "Cedar Point" is a village in Illinois.'
        required: false
        type: string
      bbox:
        description: 'Bounding box s,w,n,e instead of a place name. Wins over "place" when both are given.'
        required: false
        type: string
      name:
        description: 'Display name, e.g. "Cedar Point". Defaults to whatever the geocoder called the place.'
        required: false
        type: string
      locality:
        description: 'The line under the name, e.g. "Sandusky, Ohio".'
        required: false
        type: string
      center:
        description: 'Where the map opens, lat,lng. Worth setting when the venue owns a lot of car park — the middle of the box is not the middle of anywhere.'
        required: false
        type: string
      kind:
        description: 'What sort of place this is. Cosmetic — the pipeline treats them all the same.'
        required: false
        default: theme-park
        type: choice
        options: [theme-park, park, campus, fair, place]
      credits:
        description: 'Credit for anything not from OpenStreetMap — where ride heights were compiled from, most often.'
        required: false
        type: string
      make_default:
        description: 'Open the app on this venue by default.'
        required: false
        default: false
        type: boolean

# The job pushes a branch and opens a pull request. It never writes to the
# branch it was started from.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-venue-${{ inputs.rebuild || inputs.bbox || inputs.place }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse a run with nothing to build
        if: ${{ !inputs.place && !inputs.bbox && !inputs.rebuild }}
        run: |
          echo "::error::Give the workflow a place name, a bounding box, or a venue to rebuild."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # The builder itself has no dependencies — it is node and fetch. The
      # install is for the lint, unit and build steps that check what it made.
      - run: npm ci

      - name: Build the venue
        id: build
        env:
          PLACE: ${{ inputs.place }}
          BBOX: ${{ inputs.bbox }}
          REBUILD: ${{ inputs.rebuild }}
          NAME: ${{ inputs.name }}
          LOCALITY: ${{ inputs.locality }}
          CENTER: ${{ inputs.center }}
          KIND: ${{ inputs.kind }}
          CREDITS: ${{ inputs.credits }}
          MAKE_DEFAULT: ${{ inputs.make_default }}
        run: |
          set -uo pipefail
          # A rebuild carries its own arguments in data/venues/<id>.recipe.json,
          # which is the whole point of the file: "run every park through the new
          # tag rules" is one word here rather than four command lines
          # reconstructed out of four merged pull requests.
          args=()
          if [ -n "$REBUILD" ]; then args+=(--rebuild "$REBUILD")
          elif [ -n "$BBOX" ]; then args+=(--bbox "$BBOX")
          else args+=(--place "$PLACE"); fi
          if [ -n "$NAME" ]; then args+=(--name "$NAME"); fi
          if [ -n "$LOCALITY" ]; then args+=(--locality "$LOCALITY"); fi
          if [ -n "$CENTER" ]; then args+=(--center "$CENTER"); fi
          if [ -n "$KIND" ]; then args+=(--kind "$KIND"); fi
          if [ -n "$CREDITS" ]; then args+=(--credits "$CREDITS"); fi
          if [ "$MAKE_DEFAULT" = "true" ]; then args+=(--default); fi

          # The public Overpass mirrors rate-limit and time out under load. The
          # builder already rotates between three of them; this covers all three
          # being busy at once, which does happen.
          built=no
          for attempt in 1 2 3; do
            if node packages/venue-builder/bin/build-venue.mjs "${args[@]}" 2>&1 | tee -a build.log; then
              built=yes
              break
            fi
            echo "attempt $attempt failed — waiting before the next one"
            sleep $((attempt * 60))
          done
          if [ "$built" != yes ]; then
            echo "::error::OpenStreetMap would not answer after three attempts. Try again later."
            exit 1
          fi

          # The builder says exactly what it wrote, so take the ids from that
          # rather than guessing at how a name was slugified. Plural, because
          # "--rebuild all" writes one line per venue and reporting on only the
          # last of them would quietly hide the rest.
          ids=$(sed -n 's|^Wrote public/venues/\(.*\)\.map\.json$|\1|p' build.log | sort -u | tr '\n' ' ')
          ids=${ids% }
          if [ -z "$ids" ]; then
            echo "::error::The build wrote no map file. See the log above."
            exit 1
          fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "id=${ids%% *}" >> "$GITHUB_OUTPUT"
          echo "Built $ids"

      # The ride inventory, straight after the build that overwrites its output.
      #
      # `public/venues/<id>.pois.json` has two writers — the builder, wholesale
      # from OpenStreetMap, and this, which copies the entrances and exits that
      # clear the confidence bar onto the places they belong to. Only the first
      # of them ran here, so every rebuild silently reverted the second and the
      # sidecar was the one artifact on the graph with no schedule at all.
      # Ordering them in one job is what makes the pair a pipeline: the builder
      # writes the bundle, the inventory derives on top of it, and the result is
      # reproducible from the two files that are committed rather than from
      # whatever happened to be in the bundle already.
      #
      # It is safe to run every time because it is re-derivation, not
      # accumulation: publishing twice leaves one entry, and a run that learns
      # nothing writes nothing — which is what keeps "nothing changed" a real
      # answer below rather than a pull request full of fresh dates.
      - name: Work out the ways into every ride
        env:
          VENUE_IDS: ${{ steps.build.outputs.ids }}
        run: |
          set -euo pipefail
          : > venue-attractions.md
          for id in $VENUE_IDS; do
            node packages/venue-builder/bin/attractions.mjs "$id" --report >> venue-attractions.md
            echo >> venue-attractions.md
          done
          cat venue-attractions.md >> "$GITHUB_STEP_SUMMARY"

      - name: Say what came out
        env:
          VENUE_IDS: ${{ steps.build.outputs.ids }}
        run: |
          set -euo pipefail
          : > venue-report.md
          for id in $VENUE_IDS; do
            node packages/venue-builder/bin/venue-report.mjs "$id" >> venue-report.md
            echo >> venue-report.md
          done
          cat venue-report.md >> "$GITHUB_STEP_SUMMARY"
          cat venue-report.md

      # Everything the build could not produce, because OpenStreetMap does not
      # carry it — height rules above all. Empty when there is nothing to ask,
      # which is why it can run every time. It goes in the pull request because
      # that is where somebody is already looking at this venue and deciding
      # whether it is finished, and "it needs 17 height rules" is the answer.
      - name: Ask for what OpenStreetMap does not have
        env:
          VENUE_IDS: ${{ steps.build.outputs.ids }}
        run: |
          set -euo pipefail
          : > venue-requests.md
          for id in $VENUE_IDS; do
            node packages/venue-builder/bin/build-venue.mjs --ask "$id" >> venue-requests.md
          done
          if [ -s venue-requests.md ]; then
            cat venue-requests.md >> "$GITHUB_STEP_SUMMARY"
            cat venue-requests.md
          fi

      - name: Make sure the app still builds with it
        run: |
          npm run lint
          npm run test:unit
          npm run build -w @party-tracker/app

      - name: Certify built venue
        env:
          VENUE_IDS: ${{ steps.build.outputs.ids }}
        run: |
          set -euo pipefail
          for id in $VENUE_IDS; do
            node packages/venue-builder/bin/venue-certify.mjs "$id"
          done

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VENUE_ID: ${{ steps.build.outputs.id }}
          VENUE_IDS: ${{ steps.build.outputs.ids }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          set -euo pipefail
          branch="venue/${VENUE_ID}-${GITHUB_RUN_ID}"
          if [ -n "$REBUILD" ]; then
            title="Rebuild ${VENUE_IDS// /, } from OpenStreetMap"
          else
            title="Add ${VENUE_ID}, built from OpenStreetMap"
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/venues lib/venueIndex.js data/venues
          if git diff --cached --quiet; then
            # For a rebuild this is the good answer rather than a wasted run: it
            # means OpenStreetMap still says what we shipped.
            echo "::notice::Nothing changed — ${VENUE_IDS} already match what OpenStreetMap has."
            exit 0
          fi
          git commit -m "$title" \
                     -m "Generated by the Build a venue workflow, run ${GITHUB_RUN_ID}."
          git push -u origin "$branch"

          {
            echo "Built by [Build a venue](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from OpenStreetMap."
            echo
            cat venue-report.md
            if [ -s venue-attractions.md ]; then
              echo
              echo "<details><summary>Ways into every ride, and who says so</summary>"
              echo
              cat venue-attractions.md
              echo
              echo "</details>"
            fi
            if [ -s venue-requests.md ]; then
              echo
              echo "<details><summary>What this still needs from outside OpenStreetMap</summary>"
              echo
              cat venue-requests.md
              echo
              echo "</details>"
            fi
            echo
            echo "Map geometry is © OpenStreetMap contributors, ODbL."
          } > pr-body.md

          gh pr create --draft --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title "$title" \
            --body-file pr-body.md
