name: Test app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-app-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: Gate
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: bump version to')
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Gate checks
        id: check
        run: |
          node scripts/ci/gate-tests.mjs
          node test/app/readme-shots-check.mjs
          echo "run=true" >> "$GITHUB_OUTPUT"

  select:
    name: Select modules
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      builder: ${{ steps.mods.outputs.builder }}
      contract: ${{ steps.mods.outputs.contract }}
      lint: ${{ steps.mods.outputs.lint }}
      selector: ${{ steps.mods.outputs.selector }}
      any_ui: ${{ steps.mods.outputs.any_ui }}
      ui_matrix: ${{ steps.mods.outputs.ui_matrix }}
      modules: ${{ steps.mods.outputs.modules }}
      full_suite: ${{ steps.mods.outputs.full_suite }}
      skip_ui: ${{ steps.local_pass.outputs.skip_ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve changed modules
        id: mods
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # This commit only — merge commits diff vs main parent; bump commits are workflow-skipped.
            node test/app/select-modules.mjs --base HEAD^1 --format github
          else
            BASE_REF="${{ github.base_ref }}"
            if [ -n "$BASE_REF" ]; then
              git fetch origin "$BASE_REF" --depth=1 || true
              node test/app/select-modules.mjs --base "origin/$BASE_REF" --format github
            else
              node test/app/select-modules.mjs --base origin/main --format github
            fi
          fi

      - name: README gallery freshness
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -n "$BASE_REF" ]; then
            node test/app/readme-shots-check.mjs --base "origin/$BASE_REF"
          else
            node test/app/readme-shots-check.mjs --base origin/main
          fi

      - name: Local CI pass (skip GitHub UI when stamped)
        id: local_pass
        run: |
          BASE_REF="${{ github.base_ref }}"
          ANY_UI="${{ steps.mods.outputs.any_ui }}"
          if [ -n "$BASE_REF" ]; then
            node scripts/ci/local-ci-pass.mjs check --base "origin/$BASE_REF" --any-ui "$ANY_UI"
          else
            node scripts/ci/local-ci-pass.mjs check --base origin/main --any-ui "$ANY_UI"
          fi

      - name: Module selection summary
        run: |
          echo "modules=${{ steps.mods.outputs.modules }}"
          echo "lint=${{ steps.mods.outputs.lint }} contract=${{ steps.mods.outputs.contract }} selector=${{ steps.mods.outputs.selector }}"
          echo "builder=${{ steps.mods.outputs.builder }} any_ui=${{ steps.mods.outputs.any_ui }} full=${{ steps.mods.outputs.full_suite }}"
          echo "ui_matrix=${{ steps.mods.outputs.ui_matrix }}"

  module-select-unit:
    name: Module select unit
    needs: select
    if: needs.select.outputs.selector == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node test/app/module-select.test.mjs

  boundaries:
    name: Package boundaries
    needs: [gate, select]
    if: >-
      needs.gate.outputs.run == 'true' &&
      (needs.select.outputs.full_suite == 'true' || needs.select.outputs.modules != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:boundaries

  lint:
    name: Lint
    needs: select
    if: needs.select.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

  contract:
    name: Coverage contract
    needs: select
    if: needs.select.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:coverage-contract

  builder:
    name: Builder
    needs: select
    if: needs.select.outputs.builder == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Builder unit + compare
        run: npm run test:builder

  app-build:
    name: Build app
    needs: select
    if: needs.select.outputs.any_ui == 'true' && needs.select.outputs.skip_ui != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build Next.js app
        run: npm run build -w @party-tracker/app

      - name: Pack build for UI jobs
        run: |
          tar -C apps/party-tracker -czf party-tracker-next.tgz .next public
          ls -lh party-tracker-next.tgz
          tar -tzf party-tracker-next.tgz | head -20

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: party-tracker-next
          path: party-tracker-next.tgz
          retention-days: 1

  ui:
    name: UI · ${{ matrix.module }}
    needs: [select, app-build]
    if: needs.select.outputs.any_ui == 'true' && needs.select.outputs.skip_ui != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.select.outputs.ui_matrix || '[]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: party-tracker-next

      - name: Unpack production build
        run: node scripts/ci/party-tracker-ui.mjs unpack

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start app
        run: node scripts/ci/party-tracker-ui.mjs start

      - name: Run module ${{ matrix.module }}
        run: |
          MOD='${{ matrix.module }}'
          if [ "$MOD" = "grandma" ]; then
            npm run test:grandma
          else
            node test/app/functional.mjs --modules="$MOD"
          fi

  visual:
    name: Visual shots (soft)
    needs: [select, app-build]
    if: needs.select.outputs.any_ui == 'true' && needs.select.outputs.skip_ui != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: party-tracker-next

      - name: Unpack production build
        run: node scripts/ci/party-tracker-ui.mjs unpack

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start app
        run: node scripts/ci/party-tracker-ui.mjs start

      - name: Visual inspection shots
        run: npm run test:visual

  ci:
    name: CI
    if: always()
    needs:
      - gate
      - select
      - module-select-unit
      - boundaries
      - lint
      - contract
      - builder
      - app-build
      - ui
      - visual
    runs-on: ubuntu-latest
    steps:
      - name: Required jobs passed
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const soft = new Set(["visual"]);
            const failed = Object.entries(needs).filter(([name, job]) => {
              if (soft.has(name)) return false;
              return job.result === "failure" || job.result === "cancelled";
            });
            for (const [name, job] of Object.entries(needs)) {
              console.log(name + "=" + job.result);
            }
            if (failed.length) {
              console.error("Failed jobs:", failed.map(([n, j]) => n + "=" + j.result).join(", "));
              process.exit(1);
            }
          '
