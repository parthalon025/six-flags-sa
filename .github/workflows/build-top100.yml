# Batch-build top US theme parks through the unified pipeline.
#
# Actions → Build top parks → Run workflow.

name: Build top parks

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Start at catalog rank (inclusive)'
        required: false
        type: number
      to:
        description: 'Stop at catalog rank (inclusive)'
        required: false
        type: number
      venue_id:
        description: 'Single venue id instead of a rank range'
        required: false
        type: string
      allow_uncertified:
        description: 'Do not fail the job when certification fails'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-top-parks-${{ inputs.venue_id || inputs.from || 'all' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Discover ParksAPI entity ids
        run: npm run venues:discover-parks-api

      - name: Build parks
        id: build
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          VENUE: ${{ inputs.venue_id }}
        run: |
          set -euo pipefail
          args=(--pr --json)
          if [ -n "${VENUE:-}" ]; then args+=("$VENUE")
          else
            [ -n "${FROM:-}" ] && args+=(--from "$FROM")
            [ -n "${TO:-}" ] && args+=(--to "$TO")
          fi
          npm run venues:build-top100 -- "${args[@]}" | tee build-top100.json

      - name: Certify gate
        if: ${{ inputs.allow_uncertified != true }}
        run: npm run venues:certify -- --all

      - name: Lint and test
        run: |
          npm run lint
          npm run test:unit
