name: iOS Watch compile

# Compiles ParkBoundWatch on macOS without App Store signing.
# Also asserts pbxproj wiring on Linux.

on:
  pull_request:
    paths:
      - "ios/**"
      - "scripts/ios/**"
      - ".github/workflows/ios-watch-compile.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "scripts/ios/**"
      - ".github/workflows/ios-watch-compile.yml"
  workflow_dispatch:

concurrency:
  group: ios-watch-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ios:check-watch
      - run: node test/scripts/wire-watch-target.test.mjs

  compile-watch:
    runs-on: macos-14
    needs: wire-check
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: CocoaPods
        working-directory: ios/App
        run: |
          gem install cocoapods --no-document
          pod install --repo-update
      - name: Compile App + embedded Watch (simulator, unsigned)
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Compile Watch target alone (watchOS Simulator, unsigned)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -target ParkBoundWatch \
            -sdk watchsimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
