# Batched venue LLM research with Delta prompt cache (serverless)
resources:
  jobs:
    parkbound_llm_research:
      name: parkbound-llm-research-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: UTC
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      tasks:
        - task_key: research_batch
          environment_key: default
          spark_python_task:
            python_file: ../src/llm/research_batch.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --venue
              - kings-island
