# Batched venue LLM research with Delta prompt cache (serverless)
resources:
  jobs:
    parkbound_llm_research:
      name: parkbound-llm-research-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: UTC
      parameters:
        - name: databricks_host
          default: ${var.databricks_host}
        - name: databricks_token
          default: ${var.databricks_token}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      tasks:
        - task_key: research_batch
          environment_key: default
          spark_python_task:
            python_file: ../src/parkbound_job.py
            parameters:
              - --module
              - llm.research_batch
              - --catalog
              - ${var.catalog}
              - --venue
              - kings-island
              - --databricks-host
              - "{{job.parameters.databricks_host}}"
              - --databricks-token
              - "{{job.parameters.databricks_token}}"
