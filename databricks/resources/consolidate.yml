# Consolidate queue export + Node orchestration hook (serverless)
resources:
  jobs:
    parkbound_consolidate:
      name: parkbound-consolidate-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 7 ? * MON"
        timezone_id: UTC
      parameters:
        - name: apply
          default: "false"
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      tasks:
        - task_key: export_queue
          environment_key: default
          spark_python_task:
            python_file: ../src/transform/consolidate_queue.py
            parameters:
              - --catalog
              - ${var.catalog}
        - task_key: write_sidecars
          depends_on:
            - task_key: export_queue
          environment_key: default
          spark_python_task:
            python_file: ../src/export/write_sidecars.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --kind
              - consolidate_queue
