<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- PARKBOUND waypoint: map pin × trail marker × compass -->
  <rect width="512" height="512" rx="96" fill="#10233F"/>
  <!-- Outer diamond / trail marker -->
  <path d="M256 56 L400 256 L256 456 L112 256 Z"
        fill="none" stroke="#27B8B0" stroke-width="18" stroke-linejoin="round"/>
  <!-- Inner pin body -->
  <path d="M256 118
           C210 118 174 156 174 206
           C174 268 256 360 256 360
           S338 268 338 206
           C338 156 302 118 256 118 Z"
        fill="#FF6B35"/>
  <!-- Compass eye -->
  <circle cx="256" cy="200" r="36" fill="#F7F4EC"/>
  <circle cx="256" cy="200" r="14" fill="#10233F"/>
  <!-- Sun highlight on the pin tip direction -->
  <circle cx="256" cy="392" r="14" fill="#FFC857"/>
</svg>
